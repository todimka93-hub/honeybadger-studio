name: Build Project
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project folder (crow, wolverine, wolf)'
        required: true
        default: 'crow'
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Prepare project assets
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          python - <<'PY'
          import os,re,shutil
          from pathlib import Path
          name=os.environ['PROJECT']
          if not re.fullmatch(r'[a-z0-9_-]+',name): raise SystemExit('Invalid project')
          source=Path('projects')/name/'assets'
          if not source.is_dir(): raise SystemExit(f'Missing project assets: {source}')
          if not (source/'voice.mp3').exists(): raise SystemExit(f'Missing {source}/voice.mp3')
          images=list(source.glob('scene_*.png'))+list(source.glob('scene_*.jpg'))
          if not images: raise SystemExit(f'No scene images in {source}')
          target=Path('assets');target.mkdir(exist_ok=True)
          for p in images+[source/'voice.mp3']: shutil.copy2(p,target/p.name)
          print('Ready:',name,'images:',len(images))
          PY
      - run: python render.py
      - uses: actions/upload-artifact@v4
        with:
          name: asya-${{ inputs.project }}-mp4
          path: output/asya_shorts.mp4
          if-no-files-found: error
